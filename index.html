<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background-color: #000000; /* 改为纯黑背景，沉浸感更强 */
            -webkit-tap-highlight-color: transparent; /* 去除手机端点击的高亮背景 */
        }
        
        /* 响应式网格布局：默认手机端一行两张 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* 电脑/平板端一行四张 (屏幕宽度大于等于 768px 时生效) */
        @media (min-width: 768px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px; /* 电脑端间距稍微大一点 */
                padding: 20px;
            }
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1; /* 保持缩略图为正方形，排版更整齐 */
            object-fit: cover;
            cursor: pointer;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .gallery img:hover {
            opacity: 0.85; /* 鼠标悬停时的微弱反馈 */
        }

        /* 点击放大后的灯箱（弹窗）样式 */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95); /* 半透明黑色遮罩 */
            display: none; /* 默认隐藏 */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: zoom-out;
        }

        #lightbox img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain; /* 保证原图比例完整显示，不裁剪 */
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- 照片墙容器 (没有任何文字) -->
    <div class="gallery" id="gallery"></div>

    <!-- 放大显示容器 (默认隐藏) -->
    <div id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        // ================= 配置区 =================
        const TOTAL_IMAGES = 22;     // 你的照片总张数
        const IMAGE_EXT = '.jpg';    // 照片的格式后缀
        // ==========================================

        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        for (let i = 1; i <= TOTAL_IMAGES; i++) {
            const imgNumber = i.toString().padStart(2, '0');
            const imgName = imgNumber + IMAGE_EXT;

            const img = document.createElement('img');
            img.src = './' + imgName;
            img.loading = 'lazy'; // 开启懒加载，提升网页打开速度

            // 如果图片还未上传或者不存在，直接静默隐藏，不显示任何文字和破损图标
            img.onerror = function() {
                this.style.display = 'none';
            };

            // 点击缩略图触发放大
            img.onclick = function() {
                lightboxImg.src = this.src;
                lightbox.style.display = 'flex'; // 显示灯箱
            };

            gallery.appendChild(img);
        }

        // 点击放大后的遮罩或图片任意位置，关闭放大层
        lightbox.onclick = function() {
            this.style.display = 'none'; // 隐藏灯箱
        };
    </script>

</body>
</html>
